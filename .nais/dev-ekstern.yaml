apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: arbeidsplassen-lab
  namespace: arbeidsplassen
  labels:
    team: arbeidsplassen
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 1
    max: 1
  liveness:
    path: /api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /api/internal/isReady
    initialDelay: 10
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
    limits:
      memory: 512Mi
  ingresses:
    - https://arbeidsplassen-lab.intern.dev.nav.no
    - https://arbeidsplassen-lab.ansatt.dev.nav.no
    - https://arbeidsplassen-lab.ekstern.dev.nav.no
